{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Md Farhan Hossain Sami | Portfolio{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'my_app/css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'my_app:home' %}" class="logo">Sami<span>.</span></a>

        <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>

        <ul class="nav-links">
            <li><a href="{% url 'my_app:home' %}">Home</a></li>
            <li><a href="{% url 'my_app:project_list' %}">Projects</a></li>
            <li><a href="{% url 'my_app:about' %}">About</a></li>
            <li><a href="{% url 'my_app:about' %}#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <p>&copy; 2026 Md Farhan Hossain Sami. Built with Django.</p>
            <div class="social-links">
                <a href="mailto:mdfarhanhossainsami@gmail.com">Email</a>
                <a href="tel:+8801715027583">Phone</a>
                <a href="https://github.com/tenacioussami" target="_blank">GitHub</a>
                <a href="https://linkedin.com/in/mdfarhanhossainsami" target="_blank">LinkedIn</a>
            </div>
        </div>
    </footer>

</body>
</html>
